# nginx config for https://catalog.luxiko.be → LUXIKO catalog container
#
# Replace the addresses / certificate paths below if they change:
#   10.1.2.222      public IP nginx listens on
#   10.1.3.245:3000 Docker host + port of the catalog container
#
# Everything (pages, CSS, JS, images, downloads) is passed to the app.
# Do NOT serve files from a local "root" folder: the app's files only
# exist inside the container.

upstream luxiko_catalog {
    server 10.1.3.245:3000;
    keepalive 16;
}

# HTTP → HTTPS (Let's Encrypt renewals still work via the FastPanel include)
server {
    listen 10.1.2.222:80;
    server_name catalog.luxiko.be;

    include /etc/nginx/fastpanel2-includes/*.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 10.1.2.222:443 ssl;
    server_name catalog.luxiko.be;

    ssl_certificate     "/var/www/httpd-cert/catalog.luxiko.be_2026-09-29-16-25_33.crt";
    ssl_certificate_key "/var/www/httpd-cert/catalog.luxiko.be_2026-09-29-16-25_33.key";

    charset utf-8;

    # Library files and photos can be large
    client_max_body_size 60m;

    # The app already compresses its responses
    gzip off;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;   # catalog PDF generation can take a while
    proxy_send_timeout 180s;

    # Versioned build files: safe to cache for a year
    location /_next/static/ {
        proxy_pass http://luxiko_catalog;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://luxiko_catalog;
    }

    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log  /var/www/fastuser/data/logs/catalog.luxiko.be-frontend.error.log;
    access_log /var/www/fastuser/data/logs/catalog.luxiko.be-frontend.access.log;
}
