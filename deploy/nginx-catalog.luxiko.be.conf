# nginx config for https://catalog.luxiko.be → LUXIKO catalog container
# (FastPanel server, optionally behind Cloudflare)
#
#   10.1.2.222      IP nginx listens on
#   10.1.3.245:3000 Docker host + port of the catalog container
#
# EVERYTHING is passed to the app — pages, CSS, JS, images, downloads.
# The app's files only exist inside the container, so nginx must never try
# to serve them from a local folder. FastPanel adds such "static files"
# rules (location ~* \.(js|css|png…)$) that nginx prefers over "location /";
# they answer with an empty response, which Cloudflare shows as error 520.
# The rules below always win over those:
#   - "location ^~ /_next/" etc.  →  ^~ means "never check regex rules"
#   - our own regex rule comes BEFORE the FastPanel includes (nginx uses
#     the first regex that matches)

upstream luxiko_catalog {
    server 10.1.3.245:3000;
}

# HTTP → HTTPS
server {
    listen 10.1.2.222:80;
    server_name catalog.luxiko.be;

    # Let's Encrypt renewals (FastPanel) keep working via this include
    include /etc/nginx/fastpanel2-includes/*.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 10.1.2.222:443 ssl;
    server_name catalog.luxiko.be;

    ssl_certificate     "/var/www/httpd-cert/catalog.luxiko.be_2026-09-29-16-25_33.crt";
    ssl_certificate_key "/var/www/httpd-cert/catalog.luxiko.be_2026-09-29-16-25_33.key";

    charset utf-8;
    client_max_body_size 60m;   # library files and photos
    gzip off;                   # the app compresses its own responses

    # Real visitor IP (Cloudflare sends it in CF-Connecting-IP)
    set $luxiko_client_ip $remote_addr;
    if ($http_cf_connecting_ip) {
        set $luxiko_client_ip $http_cf_connecting_ip;
    }

    # Proxy settings, used by every location below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $luxiko_client_ip;
    proxy_set_header X-Real-IP $luxiko_client_ip;
    proxy_read_timeout 180s;    # catalog PDF generation can take a while
    proxy_send_timeout 180s;

    # App paths — ^~ makes nginx skip every regex rule (incl. FastPanel's)
    location ^~ /_next/ {
        proxy_pass http://luxiko_catalog;
    }
    location ^~ /files/ {
        proxy_pass http://luxiko_catalog;
    }
    location ^~ /brand/ {
        proxy_pass http://luxiko_catalog;
    }
    location ^~ /api/ {
        proxy_pass http://luxiko_catalog;
    }

    # Any other file with an extension → also the app (placed before the
    # FastPanel includes, so this regex is the one nginx uses)
    location ~* \.(?:css|js|mjs|map|json|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|pdf|zip|xml|gdtf|hed|d4|txt)$ {
        proxy_pass http://luxiko_catalog;
    }

    location / {
        proxy_pass http://luxiko_catalog;
    }

    # FastPanel includes (Let's Encrypt etc.) — after our rules on purpose
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log  /var/www/fastuser/data/logs/catalog.luxiko.be-frontend.error.log;
    access_log /var/www/fastuser/data/logs/catalog.luxiko.be-frontend.access.log;
}
